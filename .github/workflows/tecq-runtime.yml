name: TEC-Q runtime verification

on:
  push:
    branches: [tecq-full-runtime]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coupled-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run full standard-library suite
        run: python -m unittest discover -s tests -v
      - name: Run TEC-Q invariants independently
        run: python -m unittest discover -s tests -p "test_tecq_engine.py" -v
